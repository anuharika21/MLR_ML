<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Startup Profit Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5ff;
            border-radius: 10px;
            text-align: center;
            color: #333;
        }

        .result h2 {
            color: #667eea;
            margin-top: 8px;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Startup Profit Prediction</h1>

    <p class="subtitle">
        Multiple Linear Regression Model
    </p>

    <form action="/predict" method="POST">

        <div class="form-group">
            <label for="rd">R&D Spend</label>

            <input
                type="number"
                id="rd"
                name="rd"
                step="any"
                placeholder="Enter R&D Spend"
                required
            >
        </div>


        <div class="form-group">
            <label for="admin">Administration</label>

            <input
                type="number"
                id="admin"
                name="admin"
                step="any"
                placeholder="Enter Administration Spend"
                required
            >
        </div>


        <div class="form-group">
            <label for="marketing">Marketing Spend</label>

            <input
                type="number"
                id="marketing"
                name="marketing"
                step="any"
                placeholder="Enter Marketing Spend"
                required
            >
        </div>


        <div class="form-group">
            <label for="state">State</label>

            <select id="state" name="state" required>

                <option value="" disabled selected>
                    Select State
                </option>

                <option value="0">
                    New York
                </option>

                <option value="1">
                    California
                </option>

                <option value="2">
                    Florida
                </option>

            </select>
        </div>


        <button type="submit">
            Predict Profit
        </button>

    </form>



    <div class="result">

        <p>Predicted Profit</p>

        <h2>₹ {{ prediction }}</h2>

    </div>



    <div class="info">
        Powered by Multiple Linear Regression
    </div>

</div>

</body>
</html>
